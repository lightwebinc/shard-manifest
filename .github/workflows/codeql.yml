name: CodeQL

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: lightwebinc/ci/.github/workflows/codeql-go.yml@bfcf31c675b8206453c90497534a72886933f0a9 # main
