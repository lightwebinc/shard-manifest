name: CI

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: lightwebinc/ci/.github/workflows/go-dagger.yml@6477feb1c5a021d27e88d6891101095a1178cde9 # main
