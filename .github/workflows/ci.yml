name: CI

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: lightwebinc/ci/.github/workflows/go-dagger.yml@3f438e60ade351107a3d1601955ebbf34de8caf1 # v0.1.0
