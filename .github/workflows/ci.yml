name: CI

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: lightwebinc/ci/.github/workflows/go-dagger.yml@addd14064ef61ebf08d01de9b80bda61438880fb # v0.7.1
